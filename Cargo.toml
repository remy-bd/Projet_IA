[package]
name = "apocalypse_vulkan_fps"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "0.20"
winit = "0.29"
glam = { version = "0.28", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
rand = "0.8"
tobj = "4.0"
rodio = "0.19"
log = "0.4"
env_logger = "0.11"
instant = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
